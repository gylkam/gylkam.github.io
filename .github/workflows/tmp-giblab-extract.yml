name: tmp-giblab-extract

on:
  push:
    branches:
      - tmp/giblab-tools-20260829
  workflow_dispatch:

permissions:
  contents: write

jobs:
  extract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: tmp/giblab-tools-20260829
      - name: Download and extract official tools
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq p7zip-full unzip zip file binutils
          rm -rf _giblab_work tmp-giblab-artifacts
          mkdir -p _giblab_work/download _giblab_work/gibsaw _giblab_work/service tmp-giblab-artifacts
          UA='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/151 Safari/537.36'
          curl -k -A "$UA" --fail --location --retry 4 --connect-timeout 30 --max-time 240 \
            'https://giblab.com/download/GibSawInstall.exe' \
            -o _giblab_work/download/GibSawInstall.exe
          curl -k -A "$UA" --fail --location --retry 4 --connect-timeout 30 --max-time 240 \
            'https://service.giblab.com/download/GibServiceTestNpp.zip' \
            -o _giblab_work/download/GibServiceTestNpp.zip
          7z x -y _giblab_work/download/GibSawInstall.exe -o_giblab_work/gibsaw
          unzip -o _giblab_work/download/GibServiceTestNpp.zip -d _giblab_work/service
          find _giblab_work -type f -printf '%s\t%p\n' | sort -n > tmp-giblab-artifacts/files.tsv
          find _giblab_work -type f -exec file {} + > tmp-giblab-artifacts/file-types.txt
          grep -RInaE 'gibcut|project\.name|cPartCount|Cipher|AES|SecretKey|encrypt|decrypt|DAD1ABF3|55C00560|GibService' _giblab_work \
            --include='*.java' --include='*.js' --include='*.html' --include='*.xml' --include='*.ini' --include='*.properties' --include='*.txt' --include='*.json' \
            > tmp-giblab-artifacts/text-hits.txt || true
          while IFS= read -r f; do
            strings -a -n 8 "$f" | grep -Ei 'gibcut|project\.name|cPartCount|Cipher|AES|SecretKey|encrypt|decrypt|DAD1ABF3|55C00560|GibService' \
              | sed "s#^#$f\t#" || true
          done < <(find _giblab_work -type f \( -iname '*.exe' -o -iname '*.dll' -o -iname '*.jar' -o -iname '*.class' \)) \
            > tmp-giblab-artifacts/binary-hits.txt
          cp -a _giblab_work/service tmp-giblab-artifacts/service
          find _giblab_work/gibsaw -type f \( \
              -iname '*.exe' -o -iname '*.dll' -o -iname '*.jar' -o -iname '*.class' -o \
              -iname '*.js' -o -iname '*.html' -o -iname '*.xml' -o -iname '*.ini' -o \
              -iname '*.properties' -o -iname '*.txt' -o -iname '*.json' -o -iname '*.bat' -o -iname '*.cmd' \
            \) -print0 | tar --null -T - -czf tmp-giblab-artifacts/gibsaw-relevant.tar.gz
          sha256sum tmp-giblab-artifacts/* 2>/dev/null > tmp-giblab-artifacts/SHA256SUMS.txt || true
          du -ah tmp-giblab-artifacts | sort -h | tail -40
      - name: Commit extracted analysis package
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tmp-giblab-artifacts
          git commit -m 'chore: add temporary extracted GibLab analysis [skip ci]'
          git push origin HEAD:tmp/giblab-tools-20260829
